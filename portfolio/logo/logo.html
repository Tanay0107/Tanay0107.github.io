<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logo Project</title>

<style>
:root {
  --dabur-green: #1f5c2c;
  --accent-green: #000;
}

body {
  margin: 0;
  font-family: system-ui;
  background: #ffffff;
  color: var(--dabur-green);
}

/* TITLE */
h1 {
  text-align: center;
  padding: 25px;
}

/* GRID */
.gallery {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 22px;
  padding: 30px;
  max-width: 1200px;
  margin: auto;
}

/* CARD */
.card {
  background: white;
  border-radius: 16px;
  border: 2px solid var(--dabur-green);
  aspect-ratio: 4/3;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;

  opacity: 0;
  transform: translateY(40px) scale(0.96);
  transition: all 0.6s ease;
  will-change: transform, opacity;
}

.card.show {
  opacity: 1;
  transform: translateY(0) scale(1);
}

/* IMAGE */
.card img {
  width: 100%;
  height: 100%;
  object-fit: contain;

  filter: blur(12px);
  transform: scale(1.05);
  transition: all 0.6s ease;
}

.card img.loaded {
  filter: blur(0);
  transform: scale(1);
}

/* HOVER */
.card:hover {
  transform: scale(1.05);
  border-color: var(--accent-green);
}

/* LIGHTBOX */
#lightbox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.95);
  justify-content: center;
  align-items: center;
  z-index: 999;

  opacity: 0;
  transition: opacity 0.3s ease;
}

#lightbox.active {
  display: flex;
  opacity: 1;
}

#lightbox img {
  max-width: 90%;
  max-height: 90%;
  background: white;
  padding: 20px;
  border-radius: 12px;
  border: 3px solid var(--dabur-green);
  transition: transform 0.3s ease;
}

/* CONTROLS */
#close {
  position: absolute;
  top: 20px;
  right: 30px;
  font-size: 40px;
  cursor: pointer;
  color: white;
}

#prev, #next {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  font-size: 50px;
  cursor: pointer;
  padding: 20px;
  color: #26C9B2;
}

#prev { left: 20px; }
#next { right: 20px; }

/* KAIZEN BUTTON */
.bottom-btn {
  text-align: center;
  margin: 40px 0 60px;
}

.kaizen-btn {
  display: inline-block;
  padding: 12px 28px;
  border: 2px solid var(--dabur-green);
  border-radius: 30px;
  text-decoration: none;
  color: var(--dabur-green);
  font-weight: 600;
  transition: all 0.3s ease;
}

.kaizen-btn:hover {
  background: var(--dabur-green);
  color: #fff;
  transform: translateY(-3px) scale(1.04);
  box-shadow: 0 8px 20px rgba(0,0,0,0.15);
}

/* RESPONSIVE */
@media (max-width: 900px) {
  .gallery {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 500px) {
  .gallery {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<h1>Logo Project</h1>

<div class="gallery" id="gallery"></div>

<!-- KAIZEN BUTTON -->
<div class="bottom-btn">
  <a href="kaizen.html" class="kaizen-btn">Kaizen logo</a>
</div>

<!-- LIGHTBOX -->
<div id="lightbox">
  <span id="close">&times;</span>
  <span id="prev">&#10094;</span>
  <img id="lightbox-img">
  <span id="next">&#10095;</span>
</div>

<script>
const USER = "Tanay0107";
const REPO = "Tanay0107.github.io";
const FOLDER = "portfolio/logo";

const imageFiles = [
  "anti raggingV1-01.jpg",
  "anti raggingV1-02.jpg",
  "anti raggingV1-03.jpg",
  "Club Convesasion-31.jpg",
  "Club Convesasion-30-30.jpg",
  "Club Convesasion-32.jpg",
  "CPL_logo_final-01.jpg"
];

let images = [];
let currentIndex = 0;

const gallery = document.getElementById("gallery");

imageFiles.forEach((file, index) => {

  const url = `https://raw.githubusercontent.com/${USER}/${REPO}/main/${FOLDER}/${encodeURIComponent(file)}`;
  images.push(url);

  const card = document.createElement("div");
  card.className = "card";

  const img = document.createElement("img");
  img.dataset.src = url;
  img.loading = "lazy";

  card.appendChild(img);
  gallery.appendChild(card);

  card.onclick = () => {
    currentIndex = index;
    openLightbox();
  };
});

const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      const card = entry.target;
      const img = card.querySelector("img");

      img.src = img.dataset.src;

      img.onload = () => img.classList.add("loaded");

      card.classList.add("show");
      observer.unobserve(card);
    }
  });
}, { threshold: 0.2 });

document.querySelectorAll(".card").forEach(card => observer.observe(card));

const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");

function preload(index) {
  const img = new Image();
  img.src = images[index];
}

function openLightbox() {
  lightbox.classList.add("active");
  updateImage();
}

function closeLightbox() {
  lightbox.classList.remove("active");
}

function updateImage() {
  lightboxImg.src = images[currentIndex];

  preload((currentIndex + 1) % images.length);
  preload((currentIndex - 1 + images.length) % images.length);
}

function nextImg() {
  currentIndex = (currentIndex + 1) % images.length;
  updateImage();
}

function prevImg() {
  currentIndex = (currentIndex - 1 + images.length) % images.length;
  updateImage();
}

document.getElementById("close").onclick = closeLightbox;
document.getElementById("next").onclick = nextImg;
document.getElementById("prev").onclick = prevImg;

document.addEventListener("keydown", (e) => {
  if (!lightbox.classList.contains("active")) return;

  if (e.key === "Escape") closeLightbox();
  if (e.key === "ArrowRight") nextImg();
  if (e.key === "ArrowLeft") prevImg();
});

let startX = 0;

lightbox.addEventListener("touchstart", e => {
  startX = e.touches[0].clientX;
});

lightbox.addEventListener("touchend", e => {
  let endX = e.changedTouches[0].clientX;

  if (startX - endX > 50) nextImg();
  if (endX - startX > 50) prevImg();
});
</script>

</body>
</html>
