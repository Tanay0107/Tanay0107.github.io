<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaizen Project</title>

<style>
:root {
  --green: #1f5c2c;
}

body {
  margin: 0;
  font-family: system-ui;
  background: #ffffff;
  color: var(--green);
  text-align: center;
}

h1 {
  padding: 25px;
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 20px;
}

.container img {
  width: 100%;
  border-radius: 16px;
  border: 2px solid var(--green);
  transition: all 0.3s ease;
}

.container img:hover {
  transform: scale(1.02);
}

.back-btn {
  display: inline-block;
  margin: 40px 0;
  padding: 12px 28px;
  border: 2px solid var(--green);
  border-radius: 30px;
  text-decoration: none;
  color: var(--green);
  font-weight: 600;
  transition: all 0.3s ease;
}

.back-btn:hover {
  background: var(--green);
  color: #fff;
  transform: translateY(-3px);
}
</style>
</head>

<body>

<h1>Kaizen Project</h1>

<div class="container">
  <img src="portfolio/logo/Kaizen-01.jpg" alt="Kaizen Logo">
</div>

<a href="index.html" class="back-btn">← Back to Projects</a>

</body>
</html>
