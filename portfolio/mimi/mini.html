<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sandisk ad campaign</title>

<style>
:root {
  --green: #E2231A;
  --soft-shadow: rgba(0, 0, 0, 0.12);
  --hover-shadow: rgba(0, 0, 0, 0.2);
}

/* BASE */
body {
  margin: 0;
  font-family: system-ui, -apple-system, sans-serif;
  background: #ffffff; /* Hajmola-style background */
  color: white;
  user-select: none; /* Prevent text selection */
}

/* HEADING */
h1 {
  text-align: center;
  padding: 30px;
  font-size: 28px;
  letter-spacing: 1px;
  color: var(--green);
}

/* GRID */
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
  padding: 30px;
}

/* CARD */
.card {
  border-radius: 14px; /* Rounded rectangle corners */
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  box-shadow: 0 4px 15px var(--soft-shadow);
  border: 2px solid black; /* Full black border */
}

.card:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px var(--hover-shadow);
}

/* IMAGE */
.card img {
  width: 100%;
  aspect-ratio: 4 / 3; /* Optically pleasing rectangle */
  object-fit: cover;
  display: block;
  border-radius: 14px; /* Rounded rectangle corners to match card */
  -webkit-user-drag: none; 
  pointer-events: none;
}

/* LIGHTBOX BASE */
#lightbox {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.96);
  backdrop-filter: blur(4px);
  display: flex;
  justify-content: center;
  align-items: center;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.4s ease;
  z-index: 999;
  user-select: none;
}

/* ACTIVE LIGHTBOX */
#lightbox.show {
  opacity: 1;
  visibility: visible;
}

/* LIGHTBOX IMAGE */
#lightbox img {
  max-width: 90%;
  max-height: 90%;
  border-radius: 14px;  /* Rounded corners */
  border: 2px solid black; /* Full black border */
  transform: scale(0.8);
  opacity: 0;
  transition: transform 0.4s ease, opacity 0.3s ease;
  -webkit-user-drag: none; 
  pointer-events: none;
}

#lightbox.show img {
  transform: scale(1);
  opacity: 1;
}

/* CONTROLS */
#close {
  position: absolute;
  top: 20px;
  right: 30px;
  font-size: 40px;
  cursor: pointer;
  color: white;
}

#prev, #next {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  font-size: 50px;
  cursor: pointer;
  padding: 20px;
  user-select: none;
  color: var(--green);
}

#prev { left: 20px; }
#next { right: 20px; }

/* MOBILE */
@media (max-width: 600px) {
  h1 {
    font-size: 22px;
  }
  #prev, #next {
    font-size: 30px;
    padding: 10px;
  }
}
</style>
</head>

<body oncontextmenu="return false;"> <!-- Disable right-click -->

<h1>Sandisk ad campaign</h1>

<div class="gallery" id="gallery"></div>

<!-- LIGHTBOX -->
<div id="lightbox">
  <span id="close">&times;</span>
  <span id="prev">&#10094;</span>
  <img id="lightbox-img">
  <span id="next">&#10095;</span>
</div>

<script>
const USER = "Tanay0107";
const REPO = "Tanay0107.github.io";
const FOLDER = "portfolio/mimi";

const imageFiles = [
  "Untitled-1-01.jpg",
  "Untitled-1-02.jpg",
  "Untitled-1-03.jpg",
  "Untitled-1-04.jpg",
  "Untitled-1-05.jpg",
  "Untitled-1-06.jpg",
  "instragram add.jpg",
];

let images = [];
let currentIndex = 0;

const gallery = document.getElementById("gallery");

imageFiles.forEach((file, index) => {
  const encodedFile = encodeURIComponent(file);
  const imageUrl = `https://raw.githubusercontent.com/${USER}/${REPO}/main/${FOLDER}/${encodedFile}`;

  images.push(imageUrl);

  const card = document.createElement("div");
  card.className = "card";

  const img = document.createElement("img");
  img.src = imageUrl;
  img.draggable = false; // Prevent drag

  card.onclick = () => {
    currentIndex = index;
    openLightbox();
  };

  card.appendChild(img);
  gallery.appendChild(card);
});

/* OPEN LIGHTBOX */
function openLightbox() {
  const lightbox = document.getElementById("lightbox");
  const img = document.getElementById("lightbox-img");

  img.src = images[currentIndex];
  lightbox.classList.add("show");
}

/* CLOSE LIGHTBOX */
function closeLightbox() {
  document.getElementById("lightbox").classList.remove("show");
}

/* CHANGE IMAGE */
function changeImage(newIndex) {
  const img = document.getElementById("lightbox-img");
  img.style.opacity = 0;

  setTimeout(() => {
    currentIndex = newIndex;
    img.src = images[currentIndex];
  }, 200);

  setTimeout(() => {
    img.style.opacity = 1;
  }, 250);
}

function nextImg() {
  changeImage((currentIndex + 1) % images.length);
}

function prevImg() {
  changeImage((currentIndex - 1 + images.length) % images.length);
}

/* CONTROLS */
document.getElementById("close").onclick = closeLightbox;
document.getElementById("next").onclick = nextImg;
document.getElementById("prev").onclick = prevImg;

/* KEYBOARD */
document.addEventListener("keydown", (e) => {
  const lightbox = document.getElementById("lightbox");
  if (lightbox.classList.contains("show")) {
    if (e.key === "Escape") closeLightbox();
    if (e.key === "ArrowRight") nextImg();
    if (e.key === "ArrowLeft") prevImg();
  }
});
</script>

</body>
</html>
