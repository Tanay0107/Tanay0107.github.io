<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hajmola Ad Campaign</title>

<style>
:root {
  --green: #1f5c2c;
  --dark: #000;
  --soft-shadow: rgba(0, 0, 0, 0.12);
  --hover-shadow: rgba(0, 0, 0, 0.2);
  --lightbox-bg: rgba(0, 0, 0, 0.9);
  --border-color: #e0e0e0;
}

body {
  margin: 0;
  font-family: system-ui, -apple-system, sans-serif;
  background: #fdfdfd;
  color: var(--green);
  -webkit-font-smoothing: antialiased;
  user-select: none;
}

h1 {
  text-align: center;
  padding: 30px 20px 10px;
  font-size: 2rem;
  color: var(--green);
}

.gallery {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
  padding: 25px;
  max-width: 1200px;
  margin: auto;
}

.gallery img {
  width: 100%;
  aspect-ratio: 4 / 3;
  object-fit: cover;
  border-radius: 16px;
  cursor: pointer;
  border: 1px solid var(--border-color);
  background: #fff;
  box-shadow: 0 4px 15px var(--soft-shadow);
  -webkit-user-drag: none;
  pointer-events: auto;
  will-change: transform, opacity;
  transform: translateY(20px) scale(0.98);
  opacity: 0;
  transition: transform 0.35s ease, opacity 0.35s ease, box-shadow 0.35s ease;
}

.gallery img.show {
  transform: translateY(0) scale(1);
  opacity: 1;
}

.gallery img:hover {
  transform: scale(1.03);
  box-shadow: 0 8px 25px var(--hover-shadow);
  border-color: var(--green);
}

#lightbox {
  position: fixed;
  inset: 0;
  background: var(--lightbox-bg);
  display: flex;
  justify-content: center;
  align-items: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}

#lightbox.active {
  opacity: 1;
  pointer-events: auto;
}

#lightbox img {
  max-width: 90%;
  max-height: 90%;
  border-radius: 16px;
  border: 2px solid var(--green);
  box-shadow: 0 12px 35px rgba(0,0,0,0.3);
  transform: scale(0.95);
  opacity: 0;
  transition: all 0.3s ease;
  -webkit-user-drag: none;
  pointer-events: none;
}

#lightbox.active img {
  transform: scale(1);
  opacity: 1;
}

.control {
  position: absolute;
  color: #fff;
  font-size: 42px;
  cursor: pointer;
  user-select: none;
  transition: transform 0.2s ease, opacity 0.2s;
}

.control:hover {
  transform: scale(1.25);
}

#close { top: 20px; right: 30px; }
#prev { left: 20px; top: 50%; transform: translateY(-50%); }
#next { right: 20px; top: 50%; transform: translateY(-50%); }

@media (max-width: 900px) {
  .gallery { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 500px) {
  .gallery { grid-template-columns: 1fr; }
}
</style>
</head>

<body oncontextmenu="return false;">

<h1>Hajmola Ad Campaign</h1>

<div class="gallery" id="gallery"></div>

<div id="lightbox">
  <span class="control" id="close">&times;</span>
  <span class="control" id="prev">&#10094;</span>
  <img id="lightbox-img">
  <span class="control" id="next">&#10095;</span>
</div>

<script>
const USER = "Tanay0107";
const REPO = "Tanay0107.github.io";
const FOLDER = "portfolio/hajmola";

const imageFiles = [
  "Hajmola Brief 2026-02.jpg",
  "publishingad_2 a4.jpg",
  "hording_banana.png",
  "hording_icecream.jpg",
  "hording_pizza.png",
  "zinovative_final.jpg",
  "pressad_chiken.jpg",
  "pressad_orange.jpg",
  "pressad_watermelon.jpg"
];

let images = [];
let currentIndex = 0;

const gallery = document.getElementById("gallery");
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");

imageFiles.forEach((file, index) => {
  const url = `https://raw.githubusercontent.com/${USER}/${REPO}/main/${FOLDER}/${encodeURIComponent(file)}`;
  images.push(url);

  const img = document.createElement("img");
  img.src = url;
  img.loading = "lazy";
  img.decoding = "async";
  img.draggable = false;

  img.onclick = () => {
    currentIndex = index;
    openLightbox();
  };

  if(file === "Hajmola Brief 2026-02.jpg") {
    gallery.prepend(img);
  } else {
    gallery.appendChild(img);
  }

  requestAnimationFrame(() => {
    setTimeout(() => img.classList.add("show"), index * 80);
  });
});

function openLightbox() {
  lightbox.classList.add("active");
  updateImage();
}

function closeLightbox() {
  lightbox.classList.remove("active");
}

function updateImage() {
  lightboxImg.src = images[currentIndex];
}

function nextImg() {
  currentIndex = (currentIndex + 1) % images.length;
  updateImage();
}

function prevImg() {
  currentIndex = (currentIndex - 1 + images.length) % images.length;
  updateImage();
}

document.getElementById("close").onclick = closeLightbox;
document.getElementById("next").onclick = nextImg;
document.getElementById("prev").onclick = prevImg;

lightbox.addEventListener("click", (e) => {
  if (e.target === lightbox) closeLightbox();
});

document.addEventListener("keydown", (e) => {
  if (!lightbox.classList.contains("active")) return;
  if (e.key === "Escape") closeLightbox();
  if (e.key === "ArrowRight") nextImg();
  if (e.key === "ArrowLeft") prevImg();
});

let startX = 0;
lightbox.addEventListener("touchstart", e => startX = e.touches[0].clientX);
lightbox.addEventListener("touchend", e => {
  let endX = e.changedTouches[0].clientX;
  if (startX - endX > 50) nextImg();
  if (endX - startX > 50) prevImg();
});

function preload(index) {
  const img = new Image();
  img.src = images[index];
}
setInterval(() => preload((currentIndex + 1) % images.length), 1000);
</script>

</body>
</html>
