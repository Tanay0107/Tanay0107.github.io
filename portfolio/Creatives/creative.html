<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creatives</title>

<style>
:root {
  --green: #1f5c2c;
  --soft-shadow: rgba(0, 0, 0, 0.12);
  --hover-shadow: rgba(0, 0, 0, 0.2);
  --lightbox-bg: rgba(0, 0, 0, 0.9);
  --border-color: #e0e0e0;
}

body {
  margin: 0;
  font-family: system-ui, -apple-system, sans-serif;
  background: #fdfdfd;
  color: #166877;
  user-select: none;
}

h1 {
  text-align: center;
  padding: 30px 20px 10px;
}

/* FILTER BUTTONS */
.filters {
  text-align: center;
  margin-bottom: 15px;
}

.filters button {
  margin: 5px;
  padding: 10px 18px;
  border: none;
  border-radius: 25px;
  background: #eee;
  cursor: pointer;
  transition: 0.3s;
}

.filters button.active {
  background: var(--green);
  color: white;
}

/* GRID */
.gallery {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  padding: 25px;
  max-width: 1200px;
  margin: auto;
}

.gallery img {
  width: 100%;
  aspect-ratio: 4 / 3;
  object-fit: cover;
  border-radius: 16px;
  cursor: pointer;
  border: 1px solid var(--border-color);
  background: #fff;
  box-shadow: 0 4px 15px var(--soft-shadow);
  transform: translateY(20px) scale(0.98);
  opacity: 0;
  transition: 0.35s ease;
}

.gallery img.show {
  transform: translateY(0) scale(1);
  opacity: 1;
}

/* LIGHTBOX */
#lightbox {
  position: fixed;
  inset: 0;
  background: var(--lightbox-bg);
  display: flex;
  justify-content: center;
  align-items: center;
  opacity: 0;
  pointer-events: none;
  transition: 0.3s ease;
}

#lightbox.active {
  opacity: 1;
  pointer-events: auto;
}

#lightbox img {
  max-width: 90%;
  max-height: 90%;
  border-radius: 16px;
  border: 2px solid var(--green);
}

/* CONTROLS */
.control {
  position: absolute;
  color: #fff;
  font-size: 42px;
  cursor: pointer;
}

#close { top: 20px; right: 30px; }
#prev { left: 20px; top: 50%; transform: translateY(-50%); }
#next { right: 20px; top: 50%; transform: translateY(-50%); }

/* RESPONSIVE */
@media (max-width: 900px) {
  .gallery { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 500px) {
  .gallery { grid-template-columns: 1fr; }
}
</style>
</head>

<body oncontextmenu="return false;">

<h1>Creatives</h1>

<div class="filters">
  <button onclick="filterImages('all')" class="active">ALL</button>
  <button onclick="filterImages('mucaryl')">MUCARYL-AB</button>
  <button onclick="filterImages('nebsmart')">NEBSMART</button>
  <button onclick="filterImages('eventus')">EVENTUS</button>
</div>

<div class="gallery" id="gallery"></div>

<div id="lightbox">
  <span class="control" id="close">&times;</span>
  <span class="control" id="prev">&#10094;</span>
  <img id="lightbox-img">
  <span class="control" id="next">&#10095;</span>

  {file:"Eventus Psychiatry Font change VV3 CTC-22.jpg", type:"eventus"},

let images = [];
let currentIndex = 0;

const gallery = document.getElementById("gallery");
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");

function renderGallery(filter = "all") {
  gallery.innerHTML = "";
  images = [];

  imageFiles.forEach((item, index) => {
    if (filter !== "all" && item.type !== filter) return;

    const url = `https://${USER}.github.io/${FOLDER}/${encodeURIComponent(item.file)}`;
    images.push(url);

    const img = document.createElement("img");
    img.src = url;

    img.onclick = () => {
      currentIndex = images.indexOf(url);
      openLightbox();
    };

    gallery.appendChild(img);

    requestAnimationFrame(() => {
      setTimeout(() => img.classList.add("show"), index * 60);
    });
  });
}

function filterImages(type) {
  document.querySelectorAll(".filters button").forEach(btn =>
    btn.classList.remove("active")
  );
  event.target.classList.add("active");
  renderGallery(type);
}

/* LIGHTBOX */
function openLightbox() {
  lightbox.classList.add("active");
  updateImage();
}
function closeLightbox() {
  lightbox.classList.remove("active");
}
function updateImage() {
  lightboxImg.src = images[currentIndex];
}
function nextImg() {
  currentIndex = (currentIndex + 1) % images.length;
  updateImage();
}
function prevImg() {
  currentIndex = (currentIndex - 1 + images.length) % images.length;
  updateImage();
}

document.getElementById("close").onclick = closeLightbox;
document.getElementById("next").onclick = nextImg;
document.getElementById("prev").onclick = prevImg;

lightbox.addEventListener("click", e => {
  if (e.target === lightbox) closeLightbox();
});

document.addEventListener("keydown", e => {
  if (!lightbox.classList.contains("active")) return;
  if (e.key === "Escape") closeLightbox();
  if (e.key === "ArrowRight") nextImg();
  if (e.key === "ArrowLeft") prevImg();
});

/* INIT */
renderGallery();
</script>
