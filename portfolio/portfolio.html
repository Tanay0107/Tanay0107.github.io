<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tanay Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Inter', sans-serif;
}
body {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  background: #ffffff;
}
/* BACKGROUND BLOBS — pure green, no yellow */
body::before {
  content: '';
  position: fixed;
  width: 500px;
  height: 500px;
  background: radial-gradient(circle, rgba(100, 200, 120, 0.22), transparent 70%);
  top: -150px;
  left: -150px;
  border-radius: 50%;
  filter: blur(80px);
  pointer-events: none;
}
body::after {
  content: '';
  position: fixed;
  width: 400px;
  height: 400px;
  background: radial-gradient(circle, rgba(100, 200, 120, 0.18), transparent 70%);
  bottom: -100px;
  right: -100px;
  border-radius: 50%;
  filter: blur(80px);
  pointer-events: none;
}
.container {
  text-align: center;
  padding: 20px;
  position: relative;
  z-index: 1;
}
h1 {
  margin-bottom: 30px;
  font-weight: 600;
  letter-spacing: 1px;
  color: #1a2e1a;
}
.buttons {
  display: flex;
  flex-direction: column;
  gap: 18px;
  align-items: center;
}
.btn {
  width: 220px;
  padding: 18px;
  border-radius: 16px;
  cursor: pointer;
  font-size: 16px;
  font-weight: 500;
  background: #c8e86b;
  color: #1a2e1a;
  border: none;
  box-shadow: 0 4px 16px rgba(150, 200, 80, 0.3);
  transition: all 0.3s ease;
}
.btn:hover {
  transform: translateY(-6px);
  background: #bfde55;
  box-shadow: 0 10px 28px rgba(150, 200, 80, 0.45);
}
@media (max-width: 500px) {
  .btn { width: 180px; }
}
</style>
</head>
<body>
<div class="container">
  <h1>My Portfolio</h1>
  <div class="buttons">
    <button class="btn" onclick="openPage('chatgpt/chatgpt.html')">ChatGPT</button>
    <button class="btn" onclick="openPage('hajmola/hajmola.html')">Hajmola</button>
    <button class="btn" onclick="openPage('logo/logo.html')">Logo</button>
    <button class="btn" onclick="openPage('mimi/mini.html')">Sandisk</button>
  </div>
</div>
<script>
function openPage(page) {
  window.location.href = page;
}
</script>
</body>
</html>
