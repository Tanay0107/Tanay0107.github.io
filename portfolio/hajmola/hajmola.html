<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hajmola Ad Campaign</title>

<style>
:root {
  --green: #1f5c2c;
  --dark: #000;
}

/* BASE */
body {
  margin: 0;
  font-family: system-ui, -apple-system, sans-serif;
  background: #fff;
  color: var(--green);
  -webkit-font-smoothing: antialiased;
}

h1 {
  text-align: center;
  padding: 30px 20px 10px;
  font-size: 2rem;
}

/* GRID */
.gallery {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 18px;
  padding: 25px;
  max-width: 1200px;
  margin: auto;
}

/* IMAGE CARD */
.gallery img {
  width: 100%;
  border-radius: 14px;
  cursor: pointer;
  border: 2px solid var(--green);

  /* PERFORMANCE */
  will-change: transform, opacity;
  transform: translateY(30px) scale(0.98);
  opacity: 0;

  transition: transform 0.4s ease, opacity 0.4s ease, box-shadow 0.3s ease;
}

/* SHOW ANIMATION */
.gallery img.show {
  transform: translateY(0) scale(1);
  opacity: 1;
}

/* HOVER */
.gallery img:hover {
  transform: scale(1.04);
  box-shadow: 0 12px 30px rgba(0,0,0,0.15);
}

/* LIGHTBOX */
#lightbox {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.96);
  display: flex;
  justify-content: center;
  align-items: center;

  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}

#lightbox.active {
  opacity: 1;
  pointer-events: auto;
}

/* LIGHTBOX IMAGE */
#lightbox img {
  max-width: 92%;
  max-height: 92%;
  border-radius: 12px;
  border: 3px solid var(--green);

  transform: scale(0.95);
  opacity: 0;
  transition: all 0.3s ease;
}

#lightbox.active img {
  transform: scale(1);
  opacity: 1;
}

/* CONTROLS */
.control {
  position: absolute;
  color: white;
  font-size: 40px;
  cursor: pointer;
  user-select: none;
  transition: transform 0.2s ease, opacity 0.2s;
}

.control:hover {
  transform: scale(1.2);
}

#close { top: 20px; right: 30px; }
#prev { left: 20px; top: 50%; transform: translateY(-50%); }
#next { right: 20px; top: 50%; transform: translateY(-50%); }

/* RESPONSIVE */
@media (max-width: 900px) {
  .gallery { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 500px) {
  .gallery { grid-template-columns: 1fr; }
}
</style>
</head>

<body>

<h1>Hajmola Ad Campaign</h1>

<div class="gallery" id="gallery"></div>

<!-- LIGHTBOX -->
<div id="lightbox">
  <span class="control" id="close">&times;</span>
  <span class="control" id="prev">&#10094;</span>
  <img id="lightbox-img">
  <span class="control" id="next">&#10095;</span>
</div>

<script>
const USER = "Tanay0107";
const REPO = "Tanay0107.github.io";
const FOLDER = "portfolio/hajmola";

const imageFiles = [
  "hording_banana.png",
  "hording_icecream.jpg",
  "hording_pizza.png",
  "publishingad_2 a4.jpg",
  "pressad_chiken.jpg",
  "pressad_orange.jpg",
  "pressad_watermelon.jpg",
  "zinovative_final.jpg"
];

let images = [];
let currentIndex = 0;

const gallery = document.getElementById("gallery");
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");

/* CREATE IMAGES */
imageFiles.forEach((file, index) => {
  const url = `https://raw.githubusercontent.com/${USER}/${REPO}/main/${FOLDER}/${encodeURIComponent(file)}`;
  images.push(url);

  const img = document.createElement("img");
  img.src = url;

  /* PERFORMANCE BOOST */
  img.loading = "lazy";
  img.decoding = "async";

  img.onclick = () => {
    currentIndex = index;
    openLightbox();
  };

  gallery.appendChild(img);

  requestAnimationFrame(() => {
    setTimeout(() => img.classList.add("show"), index * 80);
  });
});

/* LIGHTBOX FUNCTIONS */
function openLightbox() {
  lightbox.classList.add("active");
  updateImage();
}

function closeLightbox() {
  lightbox.classList.remove("active");
}

function updateImage() {
  lightboxImg.src = images[currentIndex];
}

function nextImg() {
  currentIndex = (currentIndex + 1) % images.length;
  updateImage();
}

function prevImg() {
  currentIndex = (currentIndex - 1 + images.length) % images.length;
  updateImage();
}

/* CONTROLS */
document.getElementById("close").onclick = closeLightbox;
document.getElementById("next").onclick = nextImg;
document.getElementById("prev").onclick = prevImg;

/* CLICK OUTSIDE TO CLOSE */
lightbox.addEventListener("click", (e) => {
  if (e.target === lightbox) closeLightbox();
});

/* KEYBOARD */
document.addEventListener("keydown", (e) => {
  if (!lightbox.classList.contains("active")) return;

  if (e.key === "Escape") closeLightbox();
  if (e.key === "ArrowRight") nextImg();
  if (e.key === "ArrowLeft") prevImg();
});

/* SWIPE SUPPORT */
let startX = 0;

lightbox.addEventListener("touchstart", e => {
  startX = e.touches[0].clientX;
});

lightbox.addEventListener("touchend", e => {
  let endX = e.changedTouches[0].clientX;

  if (startX - endX > 50) nextImg();
  if (endX - startX > 50) prevImg();
});

/* PRELOAD NEXT IMAGE (ULTRA SMOOTH) */
function preload(index) {
  const img = new Image();
  img.src = images[index];
}

setInterval(() => {
  preload((currentIndex + 1) % images.length);
}, 1000);

</script>

</body>
</html>
