<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hajmola Ad Campaign</title>

<style>
:root {
  --dabur-green: #1f5c2c;
  --accent-green: #c8e86b;
}

body {
  margin: 0;
  font-family: system-ui;
  background: #ffffff;
  color: #1a1a1a;
}

h1 {
  text-align: center;
  padding: 25px;
  color: #000;
}

/* ✅ 4 COLUMN GRID (NO FORCED HEIGHT) */
.gallery {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
  padding: 30px;
  max-width: 1200px;
  margin: auto;
  align-items: start; /* important */
}

/* IMAGE */
.gallery img {
  width: 100%;
  height: auto; /* ✅ keep original ratio */
  display: block;

  border-radius: 12px;
  cursor: pointer;
  border: 3px solid var(--dabur-green);

  /* REMOVE ALL EFFECTS */
  filter: none !important;

  opacity: 0;
  transform: translateY(40px);
}

/* ANIMATION */
.gallery img.show {
  opacity: 1;
  transform: translateY(0);
  transition: all 0.5s ease;
}

/* HOVER */
.gallery img:hover {
  transform: scale(1.04);
  border-color: var(--accent-green);
}

/* LIGHTBOX */
#lightbox {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.95);
  justify-content: center;
  align-items: center;
  z-index: 999;
}

#lightbox img {
  max-width: 90%;
  max-height: 90%;
  border-radius: 10px;
  border: 3px solid var(--dabur-green);
}

/* CONTROLS */
#close {
  position: absolute;
  top: 20px;
  right: 30px;
  font-size: 40px;
  cursor: pointer;
  color: var(--accent-green);
}

#prev, #next {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  font-size: 50px;
  cursor: pointer;
  padding: 20px;
  color: var(--accent-green);
}

#prev { left: 20px; }
#next { right: 20px; }

/* RESPONSIVE */
@media (max-width: 900px) {
  .gallery {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 500px) {
  .gallery {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<h1>Hajmola Ad Campaign</h1>

<div class="gallery" id="gallery"></div>

<!-- LIGHTBOX -->
<div id="lightbox">
  <span id="close">&times;</span>
  <span id="prev">&#10094;</span>
  <img id="lightbox-img">
  <span id="next">&#10095;</span>
</div>

<script>
const USER = "Tanay0107";
const REPO = "Tanay0107.github.io";
const FOLDER = "portfolio/hajmola";

const imageFiles = [
  "hording_banana.png",
  "hording_icecream.jpg",
  "hording_pizza.png",
  "publishingad_2 a4.jpg",
  "pressad_chiken.jpg",
  "pressad_orange.jpg",
  "pressad_watermelon.jpg",
  "zinovative_final.jpg"
];

let images = [];
let currentIndex = 0;

const gallery = document.getElementById("gallery");

imageFiles.forEach((file, index) => {

  const encodedFile = encodeURIComponent(file);
  const url = `https://raw.githubusercontent.com/${USER}/${REPO}/main/${FOLDER}/${encodedFile}`;

  images.push(url);

  const img = document.createElement("img");
  img.src = url;

  img.onclick = () => {
    currentIndex = index;
    openLightbox();
  };

  gallery.appendChild(img);

  setTimeout(() => {
    img.classList.add("show");
  }, index * 100);
});

/* LIGHTBOX */
function openLightbox() {
  document.getElementById("lightbox").style.display = "flex";
  document.getElementById("lightbox-img").src = images[currentIndex];
}

function closeLightbox() {
  document.getElementById("lightbox").style.display = "none";
}

function nextImg() {
  currentIndex = (currentIndex + 1) % images.length;
  document.getElementById("lightbox-img").src = images[currentIndex];
}

function prevImg() {
  currentIndex = (currentIndex - 1 + images.length) % images.length;
  document.getElementById("lightbox-img").src = images[currentIndex];
}

document.getElementById("close").onclick = closeLightbox;
document.getElementById("next").onclick = nextImg;
document.getElementById("prev").onclick = prevImg;

document.addEventListener("keydown", (e) => {
  if (document.getElementById("lightbox").style.display === "flex") {
    if (e.key === "Escape") closeLightbox();
    if (e.key === "ArrowRight") nextImg();
    if (e.key === "ArrowLeft") prevImg();
  }
});
</script>

</body>
</html>
