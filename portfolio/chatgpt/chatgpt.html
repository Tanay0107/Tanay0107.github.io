<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatGPT Ad Campaign · Tanay</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*, *::before, *::after {
  margin: 0; padding: 0; box-sizing: border-box;
}

:root {
  --lime:        #c8e86b;
  --lime-glow:   rgba(200,232,107,0.12);
  --lime-border: rgba(200,232,107,0.28);
  --bg:          #090b0f;
  --surface:     rgba(255,255,255,0.034);
  --border:      rgba(255,255,255,0.07);
  --text:        #f2f2f5;
  --muted:       rgba(255,255,255,0.38);
}

html, body {
  min-height: 100%;
  background: var(--bg);
  font-family: 'Inter', sans-serif;
  color: var(--text);
  user-select: none;
}

/* ── AURORA BACKGROUND ── */
.aurora {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

.aurora::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);
  background-size: 26px 26px;
  mask-image: radial-gradient(ellipse 80% 80% at 50% 40%, black 30%, transparent 100%);
  -webkit-mask-image: radial-gradient(ellipse 80% 80% at 50% 40%, black 30%, transparent 100%);
}

.orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(72px);
  animation: drift 11s ease-in-out infinite;
}
.orb-a {
  width: 520px; height: 520px;
  background: radial-gradient(circle, rgba(145,220,80,0.2), transparent 65%);
  top: -200px; left: -160px;
  animation-delay: 0s;
}
.orb-b {
  width: 440px; height: 440px;
  background: radial-gradient(circle, rgba(90,150,255,0.14), transparent 65%);
  bottom: -180px; right: -140px;
  animation-delay: -4.5s;
}
.orb-c {
  width: 300px; height: 300px;
  background: radial-gradient(circle, rgba(190,245,100,0.09), transparent 65%);
  top: 30%; right: 10%;
  animation-delay: -8s;
}

@keyframes drift {
  0%, 100% { transform: translate(0,0) scale(1); }
  33%       { transform: translate(22px,-18px) scale(1.04); }
  66%       { transform: translate(-14px,20px) scale(0.97); }
}

/* ── PAGE LAYOUT ── */
.page {
  position: relative;
  z-index: 1;
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 28px 60px;
}

/* ── TOP NAV ── */
.topnav {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 32px 0 0;
  opacity: 0;
  animation: fadeUp 0.6s ease 0.05s forwards;
}

.back-btn {
  width: 40px; height: 40px;
  border: 1px solid var(--border);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  color: var(--muted);
  font-size: 18px;
  flex-shrink: 0;
  background: var(--surface);
  backdrop-filter: blur(12px);
  transition: all 0.25s ease;
}
.back-btn:hover {
  border-color: var(--lime-border);
  color: var(--lime);
  background: var(--lime-glow);
  transform: translateX(-3px);
}

.breadcrumb {
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.3px;
  color: var(--muted);
}
.breadcrumb span { color: rgba(255,255,255,0.18); margin: 0 6px; }
.breadcrumb strong { color: rgba(255,255,255,0.65); font-weight: 500; }

/* ── HEADER ── */
.header {
  padding: 36px 0 40px;
  opacity: 0;
  animation: fadeUp 0.7s ease 0.15s forwards;
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 3.5px;
  text-transform: uppercase;
  color: var(--lime);
  margin-bottom: 14px;
}
.eyebrow span {
  display: block;
  width: 20px; height: 1px;
  background: var(--lime);
  opacity: 0.5;
}

h1 {
  font-size: clamp(28px, 4.5vw, 48px);
  font-weight: 800;
  letter-spacing: -2px;
  line-height: 1.05;
  margin-bottom: 10px;
}
h1 em {
  font-style: normal;
  background: linear-gradient(130deg, #d4f07a 0%, #8ed43c 80%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.sub {
  font-size: 13.5px;
  color: var(--muted);
  font-weight: 400;
}

/* ── GALLERY GRID ── */
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
  gap: 16px;
}

/* ── IMAGE CARD ── */
.img-wrap {
  position: relative;
  border-radius: 18px;
  border: 1px solid var(--border);
  overflow: hidden;
  background: var(--surface);
  cursor: pointer;

  transform: translateY(28px) scale(0.97);
  opacity: 0;
  transition:
    transform 0.45s ease,
    opacity   0.45s ease;
}

.img-wrap.show {
  transform: translateY(0) scale(1);
  opacity: 1;
}

.img-wrap::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.55) 0%, transparent 45%);
  opacity: 0;
  transition: opacity 0.3s ease;
  pointer-events: none;
  border-radius: inherit;
}

.img-wrap:hover {
  border-color: var(--lime-border);
  box-shadow: 0 16px 40px rgba(0,0,0,0.4), 0 0 20px rgba(200,232,107,0.08);
  transform: translateY(-5px) scale(1.02);
}

.img-wrap:hover::after { opacity: 1; }

.img-wrap img {
  width: 100%;
  height: 220px;
  object-fit: cover;
  display: block;
  transition: transform 0.45s ease;
  -webkit-user-drag: none;
}

.img-wrap:hover img { transform: scale(1.07); }

/* Zoom icon on hover */
.zoom-icon {
  position: absolute;
  bottom: 14px;
  right: 14px;
  width: 34px; height: 34px;
  border-radius: 50%;
  background: rgba(200,232,107,0.85);
  color: #0a0c0e;
  font-size: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transform: scale(0.7);
  transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.34,1.56,0.64,1);
  pointer-events: none;
  z-index: 2;
}
.img-wrap:hover .zoom-icon {
  opacity: 1;
  transform: scale(1);
}

/* ── LIGHTBOX ── */
#lightbox {
  position: fixed;
  inset: 0;
  background: rgba(6, 8, 12, 0.96);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
  z-index: 1000;
}

#lightbox.active {
  opacity: 1;
  pointer-events: auto;
}

/* Top bar */
.lb-topbar {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  background: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent);
  z-index: 1002;
}

.lb-title {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.4);
}

.lb-counter {
  font-size: 13px;
  font-weight: 500;
  color: rgba(255,255,255,0.45);
  letter-spacing: 0.5px;
}

.lb-counter strong {
  color: var(--lime);
  font-weight: 700;
}

/* Progress bar */
.lb-progress {
  position: absolute;
  top: 0; left: 0;
  height: 2px;
  background: var(--lime);
  transition: width 0.4s ease;
  z-index: 1003;
  border-radius: 0 2px 2px 0;
}

/* Close button */
.lb-close {
  position: absolute;
  top: 14px; right: 20px;
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.12);
  background: rgba(255,255,255,0.06);
  color: rgba(255,255,255,0.7);
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
  z-index: 1003;
  user-select: none;
}
.lb-close:hover {
  background: rgba(255,255,255,0.14);
  color: #fff;
  border-color: rgba(255,255,255,0.25);
}

/* Slider */
.slider {
  display: flex;
  width: 100%;
  height: 100%;
  transition: transform 0.45s cubic-bezier(0.4,0,0.2,1);
  z-index: 1;
}

.slide {
  min-width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 80px 90px;
}

.slide img {
  max-width: 100%;
  max-height: 100%;
  border-radius: 14px;
  box-shadow: 0 32px 80px rgba(0,0,0,0.7);
  object-fit: contain;
  -webkit-user-drag: none;
}

/* Nav arrows */
.lb-nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 48px; height: 48px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(8px);
  color: rgba(255,255,255,0.7);
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.25s ease;
  user-select: none;
  z-index: 1002;
}
.lb-nav:hover {
  border-color: var(--lime-border);
  background: var(--lime-glow);
  color: var(--lime);
  transform: translateY(-50%) scale(1.08);
}

#lb-prev { left: 20px; }
#lb-next { right: 20px; }

/* ── ANIMATIONS ── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(18px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── MOBILE ── */
@media (max-width: 600px) {
  .page { padding: 0 16px 48px; }
  .gallery { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .img-wrap img { height: 160px; }
  .slide { padding: 60px 50px; }
  #lb-prev { left: 8px; }
  #lb-next { right: 8px; }
  .lb-nav { width: 38px; height: 38px; font-size: 16px; }
  h1 { letter-spacing: -1.2px; }
}

@media (prefers-reduced-motion: reduce) {
  .orb, .img-wrap, .topnav, .header { animation-duration: 0.01ms !important; }
}
</style>
</head>
<body>

<!-- Aurora -->
<div class="aurora">
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>
  <div class="orb orb-c"></div>
</div>

<div class="page">

  <!-- Top nav -->
  <nav class="topnav">
    <a href="../portfolio/portfolio.html" class="back-btn">&#8592;</a>
    <div class="breadcrumb">
      Portfolio <span>/</span> <strong>ChatGPT Ad Campaign</strong>
    </div>
  </nav>

  <!-- Header -->
  <div class="header">
    <div class="eyebrow"><span></span> Ad Campaign <span></span></div>
    <h1><em>ChatGPT</em> Campaign</h1>
    <p class="sub">13 creatives — print, digital &amp; outdoor</p>
  </div>

  <!-- Gallery -->
  <div class="gallery" id="gallery"></div>

</div>

<!-- Lightbox -->
<div id="lightbox">
  <div class="lb-progress" id="lb-progress"></div>

  <div class="lb-topbar">
    <span class="lb-title">ChatGPT Campaign</span>
    <span class="lb-counter"><strong id="lb-cur">1</strong> / <span id="lb-total">13</span></span>
  </div>

  <span class="lb-close" id="lb-close">&#215;</span>

  <div class="slider" id="slider"></div>

  <button class="lb-nav" id="lb-prev">&#10094;</button>
  <button class="lb-nav" id="lb-next">&#10095;</button>
</div>

<script>
const USER   = "Tanay0107";
const REPO   = "Tanay0107.github.io";
const FOLDER = "portfolio/chatgpt";

const imageFiles = [
  "ChatGPT Brief 2026-01.jpg",
  "CAHTGPT MAGZINE MOCK UP.jpg",
  "netwon apple mag 3-01.jpg",
  "netwon apple mag 3-02.jpg",
  "netwon apple mag 3-03.jpg",
  "poster 3-01.jpg",
  "poster 3-02.jpg",
  "poster 3_Artboard 3.jpg",
  "poster mock up tanay.jpg",
  "press ad.-01.jpg",
  "press ad.-02.jpg",
  "press ad.-03.jpg",
  "hording chat gpt-01.jpg"
];

const gallery   = document.getElementById("gallery");
const slider    = document.getElementById("slider");
const lightbox  = document.getElementById("lightbox");
const progress  = document.getElementById("lb-progress");
const curLabel  = document.getElementById("lb-cur");
const totalLabel= document.getElementById("lb-total");

let currentIndex = 0;
const images = [];

totalLabel.textContent = imageFiles.length;

imageFiles.forEach((file, index) => {
  const url = `https://raw.githubusercontent.com/${USER}/${REPO}/main/${FOLDER}/${encodeURIComponent(file)}`;
  images.push(url);

  /* Gallery card */
  const wrap = document.createElement("div");
  wrap.className = "img-wrap";

  const img = document.createElement("img");
  img.src = url;
  img.alt = file.replace(/\.[^.]+$/, '');
  img.oncontextmenu = () => false;
  img.ondragstart    = () => false;

  const zoomIcon = document.createElement("div");
  zoomIcon.className = "zoom-icon";
  zoomIcon.innerHTML = "⤢";

  img.onclick = () => { currentIndex = index; openLightbox(); };
  zoomIcon.onclick = img.onclick;

  wrap.appendChild(img);
  wrap.appendChild(zoomIcon);
  gallery.appendChild(wrap);

  requestAnimationFrame(() => {
    setTimeout(() => wrap.classList.add("show"), index * 75);
  });

  /* Lightbox slide */
  const slide    = document.createElement("div");
  slide.className = "slide";
  const slideImg  = document.createElement("img");
  slideImg.src    = url;
  slideImg.alt    = img.alt;
  slideImg.oncontextmenu = () => false;
  slideImg.ondragstart   = () => false;
  slide.appendChild(slideImg);
  slider.appendChild(slide);
});

/* Prevent right-click on page */
document.addEventListener("contextmenu", e => e.preventDefault());

function openLightbox() {
  lightbox.classList.add("active");
  updateSlider();
}
function closeLightbox() {
  lightbox.classList.remove("active");
}
function updateSlider() {
  slider.style.transform = `translateX(-${currentIndex * 100}%)`;
  curLabel.textContent   = currentIndex + 1;
  progress.style.width   = `${((currentIndex + 1) / images.length) * 100}%`;
}
function goNext() {
  currentIndex = (currentIndex + 1) % images.length;
  updateSlider();
}
function goPrev() {
  currentIndex = (currentIndex - 1 + images.length) % images.length;
  updateSlider();
}

document.getElementById("lb-close").addEventListener("click", closeLightbox);
document.getElementById("lb-next").addEventListener("click", goNext);
document.getElementById("lb-prev").addEventListener("click", goPrev);

/* Click backdrop to close */
lightbox.addEventListener("click", e => {
  if (e.target === lightbox) closeLightbox();
});

/* Keyboard navigation */
document.addEventListener("keydown", e => {
  if (!lightbox.classList.contains("active")) return;
  if (e.key === "Escape")      closeLightbox();
  if (e.key === "ArrowRight")  goNext();
  if (e.key === "ArrowLeft")   goPrev();
});

/* Touch / swipe support */
let touchStartX = 0;
lightbox.addEventListener("touchstart", e => {
  touchStartX = e.touches[0].clientX;
}, { passive: true });
lightbox.addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 50) dx < 0 ? goNext() : goPrev();
});
</script>
</body>
</html>
