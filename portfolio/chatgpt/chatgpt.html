<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatGPT Ad Campaign</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Montserrat', system-ui, sans-serif;
  background: #ffffff;
  color: #1a1a1a;
}

h1 {
  text-align: center;
  padding: 25px;
  font-weight: 700;
}

/* GALLERY */
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
  padding: 30px;
}

.img-wrap {
  border-radius: 16px;
  padding: 2.5px;
  background: #000;
  overflow: hidden;
  transition: transform 0.3s ease;
}

.img-wrap img {
  width: 100%;
  height: 200px;
  object-fit: cover;
  border-radius: 13px;
  cursor: pointer;
  transition: transform 0.4s ease;
}

.img-wrap:hover img {
  transform: scale(1.05);
}

/* LIGHTBOX */
#lightbox {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.95);
  display: none;
  overflow: hidden;
}

/* SLIDER TRACK */
.slider {
  display: flex;
  height: 100%;
  transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
}

.slide {
  min-width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
}

.slide img {
  max-width: 90%;
  max-height: 85%;
  border-radius: 12px;
  transition: transform 0.4s ease;
}

/* CONTROLS */
#close {
  position: absolute;
  top: 20px;
  right: 30px;
  font-size: 40px;
  color: #c8e86b;
  cursor: pointer;
  z-index: 10;
}

.nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  font-size: 50px;
  color: #26C9B2;
  cursor: pointer;
  z-index: 10;
}

#prev { left: 20px; }
#next { right: 20px; }

@media (max-width: 600px) {
  .img-wrap img { height: 150px; }
  .nav { font-size: 35px; }
}
</style>
</head>

<body>

<h1>ChatGPT Ad Campaign</h1>

<div class="gallery" id="gallery"></div>

<!-- LIGHTBOX -->
<div id="lightbox">
  <span id="close">&times;</span>
  <span id="prev" class="nav">&#10094;</span>
  <span id="next" class="nav">&#10095;</span>

  <div class="slider" id="slider"></div>
</div>

<script>
const USER = "Tanay0107";
const REPO = "Tanay0107.github.io";
const FOLDER = "portfolio/chatgpt";

const imageFiles = [
  "CAHTGPT MAGZINE MOCK UP.jpg",
  "brocher design-01.jpg",
  "brocher design-02.jpg",
  "hording chat gpt-01.jpg",
  "information pannel (blog}.jpg",
  "netwon apple mag 3-01.jpg",
  "netwon apple mag 3-02.jpg",
  "netwon apple mag 3-03.jpg",
  "poster 3-01.jpg",
  "poster 3-02.jpg",
  "poster 3_Artboard 3.jpg",
  "poster mock up tanay.jpg",
  "press ad.-01.jpg",
  "press ad.-02.jpg",
  "press ad.-03.jpg"
];

const gallery = document.getElementById("gallery");
const slider = document.getElementById("slider");

let currentIndex = 0;
let startX = 0;
let isDragging = false;

/* CREATE GALLERY + SLIDES */
imageFiles.forEach((file, index) => {
  const url = `https://raw.githubusercontent.com/${USER}/${REPO}/main/${FOLDER}/${encodeURIComponent(file)}`;

  // Gallery
  const wrap = document.createElement("div");
  wrap.className = "img-wrap";

  const img = document.createElement("img");
  img.src = url;
  img.onclick = () => openLightbox(index);

  wrap.appendChild(img);
  gallery.appendChild(wrap);

  // Slider
  const slide = document.createElement("div");
  slide.className = "slide";

  const slideImg = document.createElement("img");
  slideImg.src = url;

  slide.appendChild(slideImg);
  slider.appendChild(slide);
});

/* OPEN */
function openLightbox(index) {
  currentIndex = index;
  document.getElementById("lightbox").style.display = "block";
  updateSlider();
}

/* CLOSE */
document.getElementById("close").onclick = () => {
  document.getElementById("lightbox").style.display = "none";
};

/* UPDATE POSITION */
function updateSlider() {
  slider.style.transform = `translateX(-${currentIndex * 100}%)`;
}

/* NAVIGATION */
function next() {
  currentIndex = (currentIndex + 1) % imageFiles.length;
  updateSlider();
}

function prev() {
  currentIndex = (currentIndex - 1 + imageFiles.length) % imageFiles.length;
  updateSlider();
}

document.getElementById("next").onclick = next;
document.getElementById("prev").onclick = prev;

/* KEYBOARD */
document.addEventListener("keydown", (e) => {
  if (document.getElementById("lightbox").style.display === "block") {
    if (e.key === "ArrowRight") next();
    if (e.key === "ArrowLeft") prev();
    if (e.key === "Escape") close();
  }
});

/* SWIPE */
slider.addEventListener("touchstart", e => {
  startX = e.touches[0].clientX;
  isDragging = true;
});

slider.addEventListener("touchend", e => {
  if (!isDragging) return;

  let diff = startX - e.changedTouches[0].clientX;

  if (Math.abs(diff) > 50) {
    diff > 0 ? next() : prev();
  }

  isDragging = false;
});
</script>

</body>
</html>
