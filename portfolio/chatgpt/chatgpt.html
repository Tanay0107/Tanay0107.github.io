<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatGPT Ad Campaign</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Montserrat', system-ui, sans-serif;
  background: #ffffff;
  color: #1a1a1a;
  overflow-x: hidden;
}

h1 {
  text-align: center;
  padding: 25px;
  font-weight: 700;
  letter-spacing: 1px;
  color: #000; /* solid black */
}

/* GALLERY */
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
  padding: 30px;
}

/* BLACK BORDER FRAME */
.gallery .img-wrap {
  border-radius: 16px;
  padding: 2.5px;
  background: #000; /* black edge */
  box-shadow: 0 6px 18px rgba(0,0,0,0.09);
  transition: box-shadow 0.3s ease, transform 0.3s ease;
}

.gallery .img-wrap img {
  border-radius: 13px;
  width: 100%;
  height: 200px;
  object-fit: cover;
  display: block;

  transform: translateY(50px);
  opacity: 0;
  transition: transform 0.6s ease, opacity 0.6s ease;
}

.gallery .img-wrap:hover {
  transform: scale(1.05) rotate(0.8deg);
  box-shadow: 0 12px 30px rgba(0,0,0,0.12);
}

.gallery .img-wrap:hover img {
  filter: brightness(0.96);
}

/* LIGHTBOX */
#lightbox {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.92);
  justify-content: center;
  align-items: center;
  z-index: 999;
}

#lightbox img {
  max-width: 90%;
  max-height: 90%;
  border-radius: 10px;
}

#close {
  position: absolute;
  top: 20px;
  right: 30px;
  font-size: 40px;
  cursor: pointer;
  color: #c8e86b;
}

#close:hover { transform: scale(1.2); }

#prev, #next {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  font-size: 50px;
  cursor: pointer;
  padding: 20px;
  color: #26C9B2;
}

#prev { left: 20px; }
#next { right: 20px; }

@media (max-width: 600px) {
  #prev, #next { font-size: 35px; padding: 10px; }
  .gallery .img-wrap img { height: 150px; }
}
</style>
</head>

<body>

<h1>ChatGPT Ad Campaign</h1>

<div id="loading">Loading images...</div>
<div class="gallery" id="gallery"></div>

<!-- LIGHTBOX -->
<div id="lightbox">
  <span id="close">&times;</span>
  <span id="prev">&#10094;</span>
  <img id="lightbox-img">
  <span id="next">&#10095;</span>
</div>

<script>
const USER = "Tanay0107";
const REPO = "Tanay0107.github.io";
const FOLDER = "portfolio/chatgpt";

const imageFiles = [
  "CAHTGPT MAGZINE MOCK UP.jpg",
  "brocher design-01.jpg",
  "brocher design-02.jpg",
  "hording chat gpt-01.jpg",
  "information pannel (blog}.jpg",
  "netwon apple mag 3-01.jpg",
  "netwon apple mag 3-02.jpg",
  "netwon apple mag 3-03.jpg",
  "poster 3-01.jpg",
  "poster 3-02.jpg",
  "poster 3_Artboard 3.jpg",
  "poster mock up tanay.jpg",
  "press ad.-01.jpg",
  "press ad.-02.jpg",
  "press ad.-03.jpg"
];

let images = [];
let currentIndex = 0;
const gallery = document.getElementById("gallery");
document.getElementById("loading").style.display = "none";

imageFiles.forEach((file, index) => {
  const encodedFile = encodeURIComponent(file);
  const imageUrl = `https://raw.githubusercontent.com/${USER}/${REPO}/main/${FOLDER}/${encodedFile}`;
  images.push(imageUrl);

  const wrap = document.createElement("div");
  wrap.className = "img-wrap";

  const img = document.createElement("img");
  img.src = imageUrl;
  img.onerror = () => console.error("Failed:", imageUrl);
  img.onclick = () => { currentIndex = index; openLightbox(); };

  wrap.appendChild(img);
  gallery.appendChild(wrap);

  setTimeout(() => {
    img.style.transform = "translateY(0)";
    img.style.opacity = "1";
  }, index * 100);
});

/* LIGHTBOX */
let startX = 0, endX = 0;

function openLightbox() {
  document.getElementById("lightbox").style.display = "flex";
  document.getElementById("lightbox-img").src = images[currentIndex];
}

function closeLightbox() {
  document.getElementById("lightbox").style.display = "none";
}

function nextImg() {
  currentIndex = (currentIndex + 1) % images.length;
  document.getElementById("lightbox-img").src = images[currentIndex];
}

function prevImg() {
  currentIndex = (currentIndex - 1 + images.length) % images.length;
  document.getElementById("lightbox-img").src = images[currentIndex];
}

document.getElementById("close").onclick = closeLightbox;
document.getElementById("next").onclick = nextImg;
document.getElementById("prev").onclick = prevImg;

document.addEventListener("keydown", (e) => {
  const lightbox = document.getElementById("lightbox");
  if (lightbox.style.display === "flex") {
    if (e.key === "Escape") closeLightbox();
    if (e.key === "ArrowRight") nextImg();
    if (e.key === "ArrowLeft") prevImg();
  }
});

/* SWIPE SUPPORT */
const lightbox = document.getElementById("lightbox");

lightbox.addEventListener("touchstart", (e) => {
  startX = e.touches[0].clientX;
});

lightbox.addEventListener("touchend", (e) => {
  endX = e.changedTouches[0].clientX;
  let diff = startX - endX;
  if (Math.abs(diff) > 50) diff > 0 ? nextImg() : prevImg();
});
</script>

</body>
</html>
