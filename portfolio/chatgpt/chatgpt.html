<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatGPT Ad Campaign</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --accent: #26C9B2;
}

body {
  margin: 0;
  font-family: 'Montserrat', system-ui, sans-serif;
  background: #fff;
  color: #1a1a1a;
}

.back-wrap {
  max-width: 1200px;
  margin: -10px auto 10px;
  padding: 0 30px;
  display: flex;
  justify-content: flex-start;
}

.back-btn {
  width: 44px;
  height: 44px;
  border: 2px solid #000;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  color: #000;
  font-size: 20px;
  transition: all 0.3s ease;
}

.back-btn:hover {
  background: #000;
  color: #fff;
  transform: scale(1.1);
}

/* ❌ Disable text selection */
body {
  user-select: none;
}

h1 {
  text-align: center;
  padding: 25px;
  font-weight: 700;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
  padding: 30px;
}

.img-wrap {
  border-radius: 16px;
  border: 1px solid #000;
  overflow: hidden;

  transform: translateY(30px) scale(0.98);
  opacity: 0;
  transition: transform 0.4s ease, opacity 0.4s ease;
}

.img-wrap.show {
  transform: translateY(0) scale(1);
  opacity: 1;
}

.img-wrap img {
  width: 100%;
  height: 200px;
  object-fit: cover;
  border-radius: 13px;
  cursor: pointer;
  transition: transform 0.4s ease;

  -webkit-user-drag: none;
  user-select: none;
}

.img-wrap:hover img {
  transform: scale(1.05);
}

/* LIGHTBOX */
#lightbox {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.96);
  display: flex;
  justify-content: center;
  align-items: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}

#lightbox.active {
  opacity: 1;
  pointer-events: auto;
}

/* ✅ FIXED layering */
.slider {
  display: flex;
  height: 100%;
  width: 100%;
  transition: transform 0.5s ease;
  z-index: 1; /* added */
}

.slide {
  min-width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
}

.slide img {
  max-width: 90%;
  max-height: 90%;
  border-radius: 12px;

  -webkit-user-drag: none;
  user-select: none;
}

.control {
  position: absolute;
  color: white;
  font-size: 40px;
  cursor: pointer;
  user-select: none;
  z-index: 1001; /* added */
}

#close { top: 20px; right: 30px; }
#prev { left: 20px; top: 50%; transform: translateY(-50%); color:#26C9B2}
#next { right: 20px; top: 50%; transform: translateY(-50%); color:#26C9B2}

@media (max-width: 600px) {
  .img-wrap img { height: 150px; }
  .control { font-size: 30px; }
}
</style>
</head>

<body>

<h1>ChatGPT Ad Campaign</h1>

<div class="back-wrap">
  <a href="/tanay0107.github.io/portfolio/portfolio.html/" class="back-btn">&#8592;</a>
  </div>

<div class="gallery" id="gallery"></div>

<div id="lightbox">
  <span class="control" id="close">&times;</span>
  <span class="control" id="prev">&#10094;</span>
  <div class="slider" id="slider"></div>
  <span class="control" id="next">&#10095;</span>
</div>

<script>
const USER = "Tanay0107";
const REPO = "Tanay0107.github.io";
const FOLDER = "portfolio/chatgpt";

const imageFiles = [
  "ChatGPT Brief 2026-01.jpg",
  "CAHTGPT MAGZINE MOCK UP.jpg",
  "netwon apple mag 3-01.jpg",
  "netwon apple mag 3-02.jpg",
  "netwon apple mag 3-03.jpg",
  "poster 3-01.jpg",
  "poster 3-02.jpg",
  "poster 3_Artboard 3.jpg",
  "poster mock up tanay.jpg",
  "press ad.-01.jpg",
  "press ad.-02.jpg",
  "press ad.-03.jpg",
  "hording chat gpt-01.jpg"
];

const gallery = document.getElementById("gallery");
const slider = document.getElementById("slider");
const lightbox = document.getElementById("lightbox");

let currentIndex = 0;
let images = [];

imageFiles.forEach((file, index) => {
  const url = `https://raw.githubusercontent.com/${USER}/${REPO}/main/${FOLDER}/${encodeURIComponent(file)}`;
  images.push(url);

  const wrap = document.createElement("div");
  wrap.className = "img-wrap";

  const img = document.createElement("img");
  img.src = url;

  img.oncontextmenu = () => false;
  img.ondragstart = () => false;
  img.style.webkitTouchCallout = "none";

  img.onclick = () => {
    currentIndex = index;
    openLightbox();
  };

  wrap.appendChild(img);
  gallery.appendChild(wrap);

  requestAnimationFrame(() => {
    setTimeout(() => wrap.classList.add("show"), index * 80);
  });

  const slide = document.createElement("div");
  slide.className = "slide";

  const slideImg = document.createElement("img");
  slideImg.src = url;
  slideImg.oncontextmenu = () => false;
  slideImg.ondragstart = () => false;

  slide.appendChild(slideImg);
  slider.appendChild(slide);
});

document.addEventListener("contextmenu", e => e.preventDefault());

function openLightbox() {
  lightbox.classList.add("active");
  updateSlider();
}

function closeLightbox() {
  lightbox.classList.remove("active");
}

function updateSlider() {
  slider.style.transform = `translateX(-${currentIndex * 100}%)`;
}

function next() {
  currentIndex = (currentIndex + 1) % images.length;
  updateSlider();
}

function prev() {
  currentIndex = (currentIndex - 1 + images.length) % images.length;
  updateSlider();
}

document.getElementById("close").addEventListener("click", closeLightbox);
document.getElementById("next").addEventListener("click", next);
document.getElementById("prev").addEventListener("click", prev);

document.addEventListener("keydown", (e) => {
  if (!lightbox.classList.contains("active")) return;

  if (e.key === "Escape") closeLightbox();
  if (e.key === "ArrowRight") next();
  if (e.key === "ArrowLeft") prev();
});
</script>

</body>
</html>
